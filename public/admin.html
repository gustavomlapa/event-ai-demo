<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Battle Royale — Painel do Apresentador</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-badge">
      <span class="live-indicator"></span>
      <span>Tech Battle Royale — Admin</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="adminDevsCount" class="pill" style="color: #4ade80;">🔥 0 Devs Conectados</span>
      <button id="btnAdminLogout" class="pill" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; cursor: pointer;" onclick="adminApp.logout()">🔒 Bloquear</button>
    </div>
  </header>

  <main class="main-content">
    <div class="admin-container">

      <!-- Status Atual da Batalha -->
      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 1.4rem; font-weight: 800;">Estado do Jogo</h2>
          <span id="adminStatusBadge" class="pill mono" style="font-weight: 700; color: #60a5fa;">LOBBY</span>
        </div>

        <div style="margin-bottom: 16px;">
          <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Rodada Atual</div>
          <div id="adminRoundTitle" style="font-size: 1.3rem; font-weight: 800; color: #fff; margin-top: 4px;">
            Carregando rodada...
          </div>
        </div>

        <!-- Estatísticas da Rodada em Tempo Real -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px;">
          <div style="background: rgba(37, 99, 235, 0.15); border: 1px solid var(--color-a); padding: 12px; border-radius: 12px; text-align: center;">
            <div style="font-size: 0.85rem; color: var(--color-a-light);">Opção A</div>
            <div id="adminCountA" class="mono" style="font-size: 1.6rem; font-weight: 800;">0 (0%)</div>
          </div>

          <div style="background: rgba(234, 88, 12, 0.15); border: 1px solid var(--color-b); padding: 12px; border-radius: 12px; text-align: center;">
            <div style="font-size: 0.85rem; color: var(--color-b-light);">Opção B</div>
            <div id="adminCountB" class="mono" style="font-size: 1.6rem; font-weight: 800;">0 (0%)</div>
          </div>

          <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--bg-card-border); padding: 12px; border-radius: 12px; text-align: center;">
            <div style="font-size: 0.85rem; color: var(--text-secondary);">Total de Votos</div>
            <div id="adminTotalVotes" class="mono" style="font-size: 1.6rem; font-weight: 800;">0</div>
          </div>
        </div>
      </section>

      <!-- Botões de Ação do Apresentador -->
      <section class="card">
        <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 16px;">Controles do Palco</h2>
        
        <div class="admin-grid">
          <button id="btnStartRound" class="btn-admin btn-admin-green" onclick="adminApp.startRound()">
            ▶️ Abrir Votação (30s)
          </button>

          <button id="btnCloseRound" class="btn-admin btn-admin-red" onclick="adminApp.closeRound()" disabled>
            ⏹️ Fechar Votação / Revelar
          </button>

          <button id="btnNextRound" class="btn-admin btn-admin-blue" onclick="adminApp.nextRound()" disabled>
            ⏭️ Próxima Rodada
          </button>

          <button id="btnTrophies" class="btn-admin btn-admin-purple" onclick="adminApp.revealTrophies()">
            🏆 Ir para Troféus (Oscar)
          </button>
        </div>

        <div style="margin-top: 24px; border-top: 1px solid var(--bg-card-border); padding-top: 16px; text-align: right;">
          <button class="btn-admin btn-admin-gray" style="font-size: 0.9rem; padding: 10px 18px;" onclick="adminApp.resetGame()">
            🔄 Resetar Jogo (Desconectar Celulares)
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- Modal de Autenticação do Admin -->
  <div id="adminLoginModal" class="admin-modal-overlay">
    <div class="admin-modal-box">
      <div style="font-size: 2.5rem; margin-bottom: 12px;">🛡️</div>
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 8px;">Acesso ao Painel</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px;">
        Digite a senha de administrador para gerenciar o palco e controlar as rodadas.
      </p>

      <form id="adminLoginForm" onsubmit="adminApp.handleLogin(event)">
        <input 
          type="password" 
          id="adminPasswordInput" 
          class="input-nickname" 
          placeholder="Senha de acesso..." 
          autocomplete="current-password"
          required 
          style="margin-bottom: 12px; width: 100%; font-size: 1.1rem; padding: 14px;"
        >
        <div id="adminLoginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 14px; font-weight: 600; display: none;"></div>
        <button type="submit" id="btnAdminSubmitLogin" class="btn-primary" style="width: 100%;">
          Entrar no Painel
        </button>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
